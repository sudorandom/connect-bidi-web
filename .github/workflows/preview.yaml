name: preview
# Uploads a Cloudflare Workers *preview version* for every push to a
# non-production branch, so a branch can be exercised on real Workers
# infrastructure before it lands.
#
# `wrangler versions upload` is the whole reason this is safe: it uploads a
# new version and returns a preview URL, but does not shift any production
# traffic and does not touch the routes in wrangler.jsonc. Production stays
# on the custom domain until someone runs `wrangler deploy` from main.
#
# Cloudflare Workers Builds (Settings -> Builds) can do exactly the same
# thing from the dashboard, with the same command. Run one or the other,
# not both, or every push produces two preview versions.
on:
  push:
    branches-ignore:
      - main
      # release-please's bot branch only ever carries version bumps.
      - "release-please--**"
permissions:
  contents: read
# One preview per branch: a new push supersedes an in-flight upload.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  worker:
    runs-on: ubuntu-latest
    # Forked PRs get no secrets, so skip rather than fail on them.
    if: github.event.repository.fork == false
    defaults:
      run:
        working-directory: demo/worker
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Check for Cloudflare credentials
        id: creds
        # Without these the upload can only fail, and a missing secret is a
        # setup gap rather than a broken commit -- so report it and stop
        # instead of failing the run.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Workers preview skipped"
              echo
              echo "Set the \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\`"
              echo "repository secrets to enable per-branch preview uploads."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install worker dependencies
        if: steps.creds.outputs.present == 'true'
        run: npm install
      - name: Build the worker's dependencies and the demo site
        if: steps.creds.outputs.present == 'true'
        # The worker links the ts/ packages with `file:` and serves
        # demo/web/dist as its static assets, and every dist/ is gitignored,
        # so all of it has to be built first. This is the same `npm run
        # build` that Workers Builds runs, so both paths bundle the same
        # thing.
        run: npm run build
      - name: Upload a preview version
        id: upload
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler versions upload \
            --message "${GITHUB_REF_NAME}@${GITHUB_SHA:0:7}" \
            2>&1 | tee upload.log
          # Wrangler prints "Version Preview URL: https://...". Missing it
          # is not fatal: the upload itself already succeeded.
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' upload.log | head -1 || true)
          if [ -n "$url" ]; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi
      - name: Report the preview URL
        if: steps.creds.outputs.present == 'true'
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: |
          {
            echo "### Workers preview"
            echo
            if [ -n "$URL" ]; then
              echo "\`${GITHUB_REF_NAME}\` → <$URL>"
              echo
              echo "Production traffic is untouched; this is a preview version only."
            else
              echo "Uploaded a preview version of \`${GITHUB_REF_NAME}\`."
              echo "See the job log for its preview URL."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
