name: release
on:
  push:
    branches: [main]
jobs:
  # Release Please maintains a release PR that bumps versions (root
  # manifest + every ts package via release-please-config.json), updates
  # the changelog, and — when the PR is merged — creates the vX.Y.Z tag
  # and GitHub release. The plain vX.Y.Z tag also versions the Go module.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
  # Publishing runs in this same workflow because tags created with the
  # default GITHUB_TOKEN do not trigger other workflows.
  npm-publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/setup-node@v7
        with:
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm run lint
      - name: Publish packages
        # Publish order matters: core is a dependency of node and cloudflare.
        # Auth is npm Trusted Publishing (OIDC, via the id-token permission):
        # each package on npmjs.com is configured with this repo + workflow
        # as its trusted publisher. No token secret is involved; provenance
        # is generated automatically.
        # Skipping already-published versions makes releases idempotent: a
        # re-run resumes where it left off instead of dying on "cannot
        # publish over previously published versions".
        run: |
          for pkg in core web node cloudflare; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published; skipping"
            else
              npm publish --workspace "packages/$pkg" --access public
            fi
          done
