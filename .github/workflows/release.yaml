name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write # npm provenance
jobs:
  npm-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/setup-node@v7
        with:
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm run lint
      - name: Publish packages
        # Publish order matters: core is a dependency of node and cloudflare.
        # Auth is npm Trusted Publishing (OIDC, via the id-token permission):
        # each package on npmjs.com is configured with this repo + workflow
        # as its trusted publisher. No token secret is involved; provenance
        # is generated automatically. Note: trusted publishing cannot CREATE
        # a package — brand-new packages must be published once manually
        # (see "Releasing" in the README).
        # Skipping already-published versions makes releases idempotent: a
        # re-run tag or a partially failed release resumes where it left
        # off instead of dying on "cannot publish over previously published
        # versions".
        run: |
          for pkg in core web node cloudflare; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published; skipping"
            else
              npm publish --workspace "packages/$pkg" --access public
            fi
          done
