version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/sudorandom/connect-bidi-web/internal/gen
plugins:
  - local: protoc-gen-go
    out: internal/gen
    opt: paths=source_relative
  - local: ["go", "run", "connectrpc.com/connect/v2/cmd/protoc-gen-connect-go"]
    out: internal/gen
    opt: paths=source_relative
clean: true
