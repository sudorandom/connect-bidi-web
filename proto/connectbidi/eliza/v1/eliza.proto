// Derived from
// https://github.com/connectrpc/examples-go/blob/main/proto/connectrpc/eliza/v1/eliza.proto.
syntax = "proto3";

// The connectbidi.eliza.v1 package contains the demo chat service used by the
// connect-bidi-web demo application.
package connectbidi.eliza.v1;

service ElizaService {
  // Say is a unary RPC. Eliza responds to the prompt with a single sentence.
  rpc Say(SayRequest) returns (SayResponse) {}
  // Converse is a bidirectional RPC. The caller may exchange multiple
  // back-and-forth messages with Eliza over a long-lived connection.
  rpc Converse(stream ConverseRequest) returns (stream ConverseResponse) {}
  // Introduce is a server streaming RPC. Given the caller's name, Eliza
  // returns a stream of sentences to introduce itself.
  rpc Introduce(IntroduceRequest) returns (stream IntroduceResponse) {}
}

message SayRequest {
  // The sentence said to Eliza.
  string sentence = 1;
}

message SayResponse {
  // Eliza's reply.
  string sentence = 1;
}

message ConverseRequest {
  // The sentence said to Eliza.
  string sentence = 1;
}

message ConverseResponse {
  // Eliza's reply.
  string sentence = 1;
}

message IntroduceRequest {
  // The name of the person Eliza introduces itself to.
  string name = 1;
}

message IntroduceResponse {
  // One sentence of Eliza's introduction.
  string sentence = 1;
}
